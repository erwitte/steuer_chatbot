[project]
name = "steuer-chatbot"
version = "0.1.0"
description = "Personal Telegram bot for capturing German income-tax deduction Entries"
authors = [
    { name = "erik witte", email = "witte.erik2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-telegram-bot[job-queue]>=21",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true
